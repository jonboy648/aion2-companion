<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1020" />
    <title>Aion 2 Companion</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; color: #a3adcc;
        font: 14px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
      body { display: grid; place-items: center; }
      a { color: #e0b458; }
    </style>
    <script>
      // GitHub Pages serves this file for any unknown path (e.g. /build). The app uses
      // HashRouter, so send /some/path?q=1 to /#/some/path?q=1 on the site root.
      (function () {
        var p = location.pathname.replace(/^\/+|\/+$/g, "");
        if (p && p !== "404.html") {
          location.replace("/#/" + p + location.search);
        } else {
          location.replace("/");
        }
      })();
    </script>
  </head>
  <body>
    <noscript><p>JavaScript is required. <a href="/">Open Aion 2 Companion</a></p></noscript>
    <p>Redirecting&hellip;</p>
  </body>
</html>
